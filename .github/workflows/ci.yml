name: Offline simulation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.11.7
      - name: Install locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: .runtime/venv
        run: |
          python scripts/prepare_runtime.py
          uv sync --locked --no-python-downloads --python .runtime/cpython-3.12.16-20261026/bin/python3.12
      - name: Validate with OS-level network isolation
        shell: bash
        run: |
          set -euo pipefail
          parent_netns=$(readlink /proc/self/ns/net)
          uv_executable=$(command -v uv)
          # A privileged network namespace avoids dependence on the runner's
          # unprivileged-user-namespace policy. Any setup failure fails the job.
          sudo --non-interactive unshare --net -- \
            "$PWD/.runtime/venv/bin/python" scripts/validate_offline.py \
            --parent-netns "$parent_netns" --uv "$uv_executable"
